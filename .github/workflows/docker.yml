# Publishes bootgly/bootgly.kit to Docker Hub on every kit tag.
#
# The KIT is the product: framework + Console + Web + the kit entry, pinned by
# this repository's submodules. It is built HERE, and not in the framework repo,
# because a kit tag is the only reference where all three are already published
# and pinned — the framework's own tag exists before the gitlinks are updated.
#
# Tags follow "version is the axis" — the kit has one variant, so the version
# tag is the whole scheme. Pre-releases (-beta.N, -rc.N) publish their exact
# version plus a moving channel alias only; they never move `latest`. A stable
# tag moves an alias only when it is the highest published stable that alias
# covers, so a maintenance release (1.3.2 after 1.4.0) never takes `1` or
# `latest` back.
#
# The benchmark harness images are NOT downstream of this one: they build FROM
# bootgly/bootgly (the framework image), and that repository's release workflow
# is what triggers their rebuild.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g. 1.0.0-rc.1). Required on manual dispatch.'
        required: false
        default: ''
      overwrite:
        description: 'Republish an ALREADY PUBLISHED exact version tag (destructive: it changes what that tag means for everyone who pinned it).'
        required: false
        default: 'false'
      dry_run:
        description: 'Resolve and report the image tags only: no login, no build, no push.'
        type: boolean
        required: false
        default: false

# ! Publishes run one at a time, in order: a run resolves the aliases from the
#   tags published when it starts, so two overlapping tag pushes could otherwise
#   push in the opposite order and move `latest` back. `queue: max` keeps every
#   waiting run (the default keeps one and cancels the others). A dry run gets
#   a group of its own, so it never waits behind or delays a real publish.
concurrency:
  group: ${{ inputs.dry_run && format('docker-dry-run-{0}', github.run_id) || 'docker-publish' }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ! No submodules: the image git-clones this repository at the tag. The
      #   checkout here exists only to read which framework commit the tag pins.
      # ! Three refs, deliberately separated — conflating them is what broke the
      #   first dispatch of this workflow:
      #     · the CHECKOUT provides the Dockerfile, so it must be a ref that HAS
      #       one. On a tag push that is the tag itself; on a dispatch it is this
      #       workflow's own ref, because a version tagged before the Dockerfile
      #       existed carries no Dockerfile and buildx fails with
      #       `failed to read dockerfile`.
      #     · the SOURCE ref (`v<version>`) is what the gitlink is read from, so
      #       the image is never stamped with a framework revision it does not
      #       contain — the default branch can sit past the tag.
      #     · `BOOTGLY_KIT_REF` is what the image CLONES, and is the source ref
      #       too. The image content comes from there, never from this checkout.
      #   `fetch-depth: 0` so the source ref is readable whichever one is out.
      - name: Checkout the kit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || github.ref }}
          fetch-depth: 0

      - name: Resolve the pinned framework revision
        id: source
        env:
          SOURCE_REF: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_REF:-}" ]; then
            echo "::error::No source ref resolved (provide the 'version' input on manual dispatch)."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${SOURCE_REF}" > /dev/null; then
            :
          else
            echo "::error::Tag ${SOURCE_REF} does not exist in this repository — the image clones it, so it must be pushed first."
            exit 1
          fi
          SHA="$(git ls-tree "refs/tags/${SOURCE_REF}" Bootgly | awk '{print $3}')"
          if [ -z "$SHA" ]; then
            echo "::error::Could not read the Bootgly gitlink of ${SOURCE_REF}."
            exit 1
          fi
          echo "framework_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Source ref: ${SOURCE_REF} — framework pinned at: $SHA"

      # ! Every untrusted value reaches the shell through `env:`, never through
      #   `${{ }}` inside `run:` — GitHub substitutes those TEXTUALLY before bash
      #   parses the script, and git accepts shell metacharacters in a ref name
      #   (`git check-ref-format 'refs/tags/v1.0.0";id;#'` is legal). This job
      #   holds the Docker Hub credentials for the whole `bootgly/*` namespace,
      #   so a crafted tag push must not become a command.
      - name: Resolve version and tags
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          # ? `inputs` is empty on a tag push: that is a real publish.
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # ! Written first, before any path can stop this step: every step that
          #   logs in, builds or pushes runs only when it reads exactly `false`.
          case "${DRY_RUN:-}" in
            true|false) ;;
            *)
              echo "::error::dry_run must be true or false (got '${DRY_RUN:-}')."
              exit 1
              ;;
          esac
          echo "dry=$DRY_RUN" >> "$GITHUB_OUTPUT"

          if [ "${REF_TYPE:-}" = 'tag' ]; then
            V="${REF_NAME:-}"
          else
            V="${INPUT_VERSION:-}"
          fi
          V="${V#v}"
          if [ -z "$V" ]; then
            echo "::error::No version resolved (provide the 'version' input on manual dispatch)."
            exit 1
          fi

          # ! Tag scheme — the version IS the tag. The kit has one variant, so
          #   there is no suffix to confuse it with:
          #
          #     stable 1.2.3 → 1.2.3  1.2  1  latest   (each alias only when
          #                                              1.2.3 is the highest
          #                                              stable it covers)
          #     pre-release  → 1.0.0-rc.1  rc
          #
          # ? A pre-release must NEVER move `latest` or the major/minor aliases:
          #   `docker pull bootgly/bootgly.kit` would hand unreleased code to
          #   every user. Pre-releases publish their exact version plus a moving
          #   channel alias (`beta`, `rc`) that people opt into deliberately.
          #   The version must be one of the two shapes: anything else (`1.2`,
          #   `1.4.1-1`, `1.4.0-latest.1`) would otherwise publish a numeric
          #   alias or a channel named like one — and a tag push publishes at once.
          N='(0|[1-9][0-9]*)'
          STABLE_RE="^$N\.$N\.$N\$"
          PRERELEASE_RE="^$N\.$N\.$N-(alpha|beta|rc)(\.$N)?\$"
          if [[ "$V" =~ $STABLE_RE ]]; then
            PRERELEASE=false
          elif [[ "$V" =~ $PRERELEASE_RE ]]; then
            PRERELEASE=true
          else
            echo "::error::'$V' is neither X.Y.Z nor X.Y.Z-<alpha|beta|rc>[.N]."
            exit 1
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

          REPO=bootgly/bootgly.kit
          if [ "$PRERELEASE" = "true" ]; then
            CHANNEL="${V#*-}"        # 1.0.0-rc.1 → rc.1
            CHANNEL="${CHANNEL%%.*}" # rc.1       → rc
            TAGS="$REPO:$V"$'\n'"$REPO:$CHANNEL"
          else
            MAJOR="${V%%.*}"
            MINOR="${V%.*}"
            # ! "Published" = this repository's `vX.Y.Z` tags on origin, read
            #   from the remote. A maintenance release (1.3.2 after 1.4.0) moves
            #   `1.3` but neither `1` nor `latest`; a re-dispatch of an older
            #   patch moves nothing.
            REMOTE="$(git ls-remote --tags --refs origin)"
            PUBLISHED="$(printf '%s\n' "$REMOTE" \
              | sed -n -E "s#^[0-9a-f]+[[:space:]]+refs/tags/v($N\.$N\.$N)\$#\1#p" \
              | sort -u -V)"
            echo "published stable tags:"; echo "$PUBLISHED"
            # ? A tag list that collapsed (wrong remote, empty answer) must not
            #   read as "this version is the highest": fail closed.
            COUNT="$(grep -c . <<< "$PUBLISHED" || true)"
            if [ "$COUNT" -lt 2 ]; then
              echo "::error::Only $COUNT published stable tag(s) visible on origin — refusing to decide the moving aliases."
              exit 1
            fi
            if ! grep -qxF "$V" <<< "$PUBLISHED"; then
              echo "::error::Tag v$V is not on origin — cannot place it among the published versions."
              exit 1
            fi
            # highest <major|''> <minor|''> → the highest published X.Y.Z in that range
            highest () {
              awk -F. -v x="$1" -v y="$2" '(x == "" || $1 == x) && (y == "" || $2 == y)' <<< "$PUBLISHED" \
                | sort -V | tail -n 1
            }
            TAGS="$REPO:$V"
            if [ "$(highest "$MAJOR" "${MINOR#*.}")" = "$V" ]; then
              TAGS+=$'\n'"$REPO:$MINOR"
            fi
            if [ "$(highest "$MAJOR" '')" = "$V" ]; then
              TAGS+=$'\n'"$REPO:$MAJOR"
            fi
            if [ "$(highest '' '')" = "$V" ]; then
              TAGS+=$'\n'"$REPO:latest"
            fi
          fi

          {
            echo "prerelease=$PRERELEASE"
            echo "tags<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved version: $V (prerelease: $PRERELEASE, dry run: $DRY_RUN)"
          echo "tags:"; echo "$TAGS"

      # ? An exact version tag is IMMUTABLE — it names the code of one published
      #   release, and people pin it. Re-pushing one would hand a different kit
      #   to everyone already on it.
      #
      # ! The guard fails CLOSED on anything it cannot read. `404` is free. `401`
      #   is ALSO free here, but only while `bootgly/bootgly.kit` does not exist
      #   yet — the registry hides an unknown repository behind auth, and every
      #   tag of this repository answers `401` today. Once the repository is
      #   published, a `401` means the token failed instead, so the step warns
      #   loudly rather than passing quietly. A `429` (Hub rate-limits the
      #   anonymous pull token this step mints) stops the run: `curl -s` calls it
      #   success, and reading it as "free" is how a published tag gets replaced.
      #
      # ? A dry run reports what this guard would decide instead of stopping.
      - name: Refuse to overwrite a published version tag
        if: inputs.overwrite != 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          DRY: ${{ steps.version.outputs.dry }}
        run: |
          set -euo pipefail
          refuse () {
            if [ "$DRY" = "true" ]; then
              echo "::notice::Dry run — a real run would stop here: $1"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }
          TOKEN="$(curl -fsSL \
            'https://auth.docker.io/token?service=registry.docker.io&scope=repository:bootgly/bootgly.kit:pull' \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
          if [ -z "$TOKEN" ]; then
            refuse "Could not obtain a registry pull token — cannot prove bootgly/bootgly.kit:$VERSION is free."
          fi
          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            "https://registry-1.docker.io/v2/bootgly/bootgly.kit/manifests/$VERSION")"
          case "$CODE" in
            404)
              echo "bootgly/bootgly.kit:$VERSION is free."
              ;;
            401)
              echo "::warning::The registry answered 401 for bootgly/bootgly.kit:$VERSION — expected while the repository does not exist on Hub yet. Once it is published, a 401 means the pull token failed and this step is no longer proving anything."
              ;;
            200)
              refuse "bootgly/bootgly.kit:$VERSION is already published. An exact version tag is immutable — cut a new version, or dispatch again with overwrite=true if you really mean to replace what that tag hands every user."
              ;;
            *)
              refuse "The registry answered $CODE for bootgly/bootgly.kit:$VERSION — that proves neither free nor taken, so this run stops instead of guessing."
              ;;
          esac

      # ! arm64 is built under emulation — Apple Silicon and ARM servers are a
      #   large share of the users, and an amd64-only image makes them run the
      #   whole framework through Rosetta/QEMU at runtime instead of at build.
      - name: Set up QEMU (cross-platform build)
        if: steps.version.outputs.dry == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.version.outputs.dry == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.version.outputs.dry == 'false'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the kit image
        if: steps.version.outputs.dry == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: kit
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          # ! Emulated arm64 compiles the PHP extensions; without a cache every
          #   release pays that cost from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BOOTGLY_VERSION=${{ steps.version.outputs.value }}
            BOOTGLY_KIT_REF=${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
            BOOTGLY_FRAMEWORK_SHA=${{ steps.source.outputs.framework_sha }}
          tags: ${{ steps.version.outputs.tags }}

      # ? A real publish (tag push) that skipped the steps above must not finish
      #   green: the gate reads the dry flag in its positive form, so a missing
      #   flag skips publishing — and lands here.
      - name: Refuse a tag run that published nothing
        if: github.event_name != 'workflow_dispatch' && steps.version.outputs.dry != 'false'
        run: |
          echo "::error::This tag run resolved no 'dry=false' flag, so nothing was published."
          exit 1
